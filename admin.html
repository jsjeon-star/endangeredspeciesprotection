<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 — ART BONBON SCHOOL</title>
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
body { font-family:'Pretendard',sans-serif; background:#0f1923; color:#e0e8f0; min-height:100vh; }

/* 로그인 화면 */
.login-wrap {
  min-height:100vh; display:flex; align-items:center; justify-content:center;
}
.login-box {
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:16px; padding:40px 36px;
  width:340px; text-align:center;
}
.login-box h1 { font-size:20px; font-weight:700; margin-bottom:6px; color:#fff; }
.login-box p  { font-size:12px; color:rgba(255,255,255,0.45); margin-bottom:28px; }
.pw-input {
  width:100%; padding:12px 16px;
  background:rgba(255,255,255,0.08);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:10px; color:#fff;
  font-family:'Pretendard',sans-serif; font-size:14px;
  outline:none; margin-bottom:12px;
  transition:border-color .2s;
}
.pw-input:focus { border-color:rgba(100,180,255,0.6); }
.pw-input::placeholder { color:rgba(255,255,255,0.3); }
.login-btn {
  width:100%; padding:12px;
  background:#0090d0; border:none; border-radius:10px;
  color:#fff; font-family:'Pretendard',sans-serif;
  font-size:14px; font-weight:700; cursor:pointer;
  transition:background .2s;
}
.login-btn:hover { background:#007ab8; }
.login-err { font-size:12px; color:#ff7070; margin-top:10px; display:none; }

/* 관리자 대시보드 */
.admin-wrap { display:none; padding:32px; max-width:1100px; margin:0 auto; }
.admin-header {
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:28px;
}
.admin-header h1 { font-size:22px; font-weight:700; color:#fff; }
.admin-header p  { font-size:12px; color:rgba(255,255,255,0.45); margin-top:2px; }

/* 통계 카드 */
.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:28px; }
.stat-card {
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px; padding:16px 18px;
}
.stat-label { font-size:11px; color:rgba(255,255,255,0.45); margin-bottom:4px; }
.stat-num   { font-size:26px; font-weight:700; color:#7dd8ff; }
.stat-sub   { font-size:11px; color:rgba(255,255,255,0.4); margin-top:2px; }

/* 탭 */
.tabs { display:flex; gap:8px; margin-bottom:20px; }
.tab-btn {
  padding:8px 20px; border-radius:20px;
  border:1px solid rgba(255,255,255,0.15);
  background:transparent; color:rgba(255,255,255,0.6);
  font-family:'Pretendard',sans-serif; font-size:13px; font-weight:600;
  cursor:pointer; transition:all .2s;
}
.tab-btn.active { background:#0090d0; border-color:#0090d0; color:#fff; }

/* 내보내기 버튼 */
.export-row { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
.export-btn {
  padding:9px 20px;
  background:rgba(0,144,208,0.2);
  border:1px solid rgba(0,144,208,0.4);
  border-radius:20px; cursor:pointer;
  color:#7dd8ff; font-family:'Pretendard',sans-serif;
  font-size:12px; font-weight:700; transition:background .2s;
}
.export-btn:hover { background:rgba(0,144,208,0.35); }

/* 메시지 테이블 */
.msg-table { width:100%; border-collapse:collapse; }
.msg-table th {
  text-align:left; padding:10px 14px;
  font-size:11px; font-weight:600;
  color:rgba(255,255,255,0.45);
  border-bottom:1px solid rgba(255,255,255,0.1);
}
.msg-table td {
  padding:10px 14px;
  font-size:12px; color:rgba(255,255,255,0.8);
  border-bottom:1px solid rgba(255,255,255,0.06);
  vertical-align:top;
}
.msg-table tr:hover td { background:rgba(255,255,255,0.03); }
.animal-tag {
  display:inline-block; padding:2px 8px;
  border-radius:10px; font-size:10px; font-weight:700;
}
.tag-turtle { background:rgba(0,180,130,0.2); color:#5dffc0; }
.tag-bear   { background:rgba(180,200,255,0.2); color:#c0d0ff; }
.tag-whale  { background:rgba(100,150,255,0.2); color:#90b8ff; }
.tag-manta  { background:rgba(120,200,255,0.2); color:#7dd8ff; }

/* 갤러리 그리드 */
.gallery-section { display:none; }
.gallery-filter { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
.gf-btn {
  padding:6px 14px; border-radius:16px;
  border:1px solid rgba(255,255,255,0.15);
  background:transparent; color:rgba(255,255,255,0.55);
  font-family:'Pretendard',sans-serif; font-size:12px;
  cursor:pointer; transition:all .2s;
}
.gf-btn.active { background:rgba(0,144,208,0.3); border-color:#0090d0; color:#7dd8ff; }
.gallery-grid {
  display:grid; grid-template-columns:repeat(auto-fill, minmax(130px,1fr));
  gap:10px;
}
.gallery-item {
  border-radius:10px; overflow:hidden;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.08);
  cursor:pointer; transition:transform .2s;
}
.gallery-item:hover { transform:scale(1.03); }
.gallery-item img { width:100%; aspect-ratio:1; object-fit:cover; display:block; }
.gallery-item-info { padding:6px 8px; }
.gallery-item-info span { font-size:10px; color:rgba(255,255,255,0.4); }

/* 라이트박스 */
.lightbox {
  position:fixed; inset:0; background:rgba(0,0,0,0.85);
  z-index:999; display:none;
  align-items:center; justify-content:center; flex-direction:column; gap:12px;
}
.lightbox.show { display:flex; }
.lightbox img { max-width:80vw; max-height:75vh; border-radius:12px; }
.lightbox-close {
  position:absolute; top:20px; right:24px;
  background:none; border:none; color:#fff; font-size:28px; cursor:pointer;
}
.lightbox-info { color:rgba(255,255,255,0.7); font-size:13px; }

/* 로딩 */
.loading { text-align:center; padding:40px; color:rgba(255,255,255,0.35); font-size:13px; }

/* 빈 상태 */
.empty { text-align:center; padding:40px; color:rgba(255,255,255,0.3); font-size:13px; }

.section-active { display:block; }
</style>
</head>
<body>

<!-- 로그인 -->
<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <h1>🔒 관리자 페이지</h1>
    <p>ART BONBON SCHOOL 캠페인 데이터 관리</p>
    <input class="pw-input" type="password" id="pwInput" placeholder="비밀번호 입력"
      onkeydown="if(event.key==='Enter')checkPw()">
    <button class="login-btn" onclick="checkPw()">로그인</button>
    <div class="login-err" id="loginErr">비밀번호가 올바르지 않습니다.</div>
  </div>
</div>

<!-- 대시보드 -->
<div class="admin-wrap" id="adminWrap">
  <div class="admin-header">
    <div>
      <h1>📊 캠페인 관리자</h1>
      <p>ART BONBON SCHOOL — 멸종위기 동물 보호 캠페인</p>
    </div>
    <button onclick="logout()" style="padding:8px 16px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:20px;color:rgba(255,255,255,0.6);font-family:'Pretendard',sans-serif;font-size:12px;cursor:pointer;">로그아웃</button>
  </div>

  <!-- 통계 -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">전체 응원 메시지</div>
      <div class="stat-num" id="totalMsg">-</div>
      <div class="stat-sub">누적</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">전체 그림 업로드</div>
      <div class="stat-num" id="totalDraw">-</div>
      <div class="stat-sub">누적</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">가장 많은 응원</div>
      <div class="stat-num" id="topAnimalMsg" style="font-size:18px;">-</div>
      <div class="stat-sub">동물</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">가장 많은 그림</div>
      <div class="stat-num" id="topAnimalDraw" style="font-size:18px;">-</div>
      <div class="stat-sub">동물</div>
    </div>
  </div>

  <!-- 탭 -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('msg', this)">💬 응원 메시지</button>
    <button class="tab-btn" onclick="switchTab('gallery', this)">🎨 그림 갤러리</button>
  </div>

    <div class="export-row">
    <button class="export-btn" onclick="exportMessages()">📥 메시지 CSV 다운로드</button>
    <button class="export-btn" onclick="exportDrawings()">📥 그림 목록 CSV 다운로드</button>
    <button class="export-btn" onclick="exportSummary()">📥 요약 통계 CSV 다운로드</button>
    <button class="export-btn" onclick="resetOcean()" style="background:rgba(220,50,50,0.15);border-color:rgba(220,50,50,0.4);color:#ff9090;margin-left:auto;">🌊 바다 화면 리셋</button>
  </div>

  <!-- 메시지 섹션 -->
  <div id="msgSection">
    <div class="loading" id="msgLoading">데이터 불러오는 중...</div>
    <table class="msg-table" id="msgTable" style="display:none;">
      <thead>
        <tr>
          <th>동물</th>
          <th>응원 메시지</th>
          <th>등록 시간</th>
        </tr>
      </thead>
      <tbody id="msgBody"></tbody>
    </table>
    <div class="empty" id="msgEmpty" style="display:none;">아직 메시지가 없습니다.</div>
  </div>

  <!-- 갤러리 섹션 -->
  <div id="gallerySection" class="gallery-section">
    <div class="gallery-filter">
      <button class="gf-btn active" onclick="filterGallery('all', this)">전체</button>
      <button class="gf-btn" onclick="filterGallery('바다거북', this)">🐢 바다거북</button>
      <button class="gf-btn" onclick="filterGallery('북극곰', this)">🐻‍❄️ 북극곰</button>
      <button class="gf-btn" onclick="filterGallery('향유고래', this)">🐋 향유고래</button>
      <button class="gf-btn" onclick="filterGallery('대왕만타가오리', this)">대왕만타가오리</button>
    </div>
    <div class="loading" id="galleryLoading" style="display:none;">데이터 불러오는 중...</div>
    <div class="gallery-grid" id="galleryGrid"></div>
    <div class="empty" id="galleryEmpty" style="display:none;">아직 그림이 없습니다.</div>
  </div>
</div>

<!-- 라이트박스 -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lbImg" src="" alt="">
  <div class="lightbox-info" id="lbInfo"></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
// Firebase 초기화
firebase.initializeApp({
  apiKey: "AIzaSyCQk_3WOh3q049MRKj9Bf9DFGmPhnHS4JE",
  authDomain: "endangerdspeciesartbonbon.firebaseapp.com",
  projectId: "endangerdspeciesartbonbon",
  storageBucket: "endangerdspeciesartbonbon.firebasestorage.app",
  messagingSenderId: "692482885958",
  appId: "1:692482885958:web:b48001f99deb54a2e5bd47"
});
const db = firebase.firestore();

// ── 비밀번호 (변경하세요!)
const ADMIN_PW = 'artbonbon2025';

let allMessages = [];
let allDrawings = [];

function checkPw() {
  const pw = document.getElementById('pwInput').value;
  if (pw === ADMIN_PW) {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('adminWrap').style.display = 'block';
    loadData();
  } else {
    document.getElementById('loginErr').style.display = 'block';
  }
}

function logout() {
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('adminWrap').style.display = 'none';
  document.getElementById('pwInput').value = '';
}

// ── 데이터 로드
async function loadData() {
  // 메시지
  const msgSnap = await db.collection('messages').orderBy('timestamp','desc').get();
  allMessages = [];
  msgSnap.forEach(doc => {
    const d = doc.data();
    allMessages.push({
      animal: d.animal || '',
      key: d.key || '',
      text: d.text || '',
      time: d.timestamp ? d.timestamp.toDate().toLocaleString('ko-KR') : '-'
    });
  });

  // 그림
  const drawSnap = await db.collection('drawings').orderBy('timestamp','desc').get();
  allDrawings = [];
  drawSnap.forEach(doc => {
    const d = doc.data();
    allDrawings.push({
      animal: d.animal || '',
      key: d.key || '',
      src: d.src || '',
      time: d.timestamp ? d.timestamp.toDate().toLocaleString('ko-KR') : '-'
    });
  });

  updateStats();
  renderMessages();
  renderGallery('all');
}

function updateStats() {
  document.getElementById('totalMsg').textContent   = allMessages.length;
  document.getElementById('totalDraw').textContent  = allDrawings.length;

  // 가장 많은 동물 (메시지)
  const msgCount = {};
  allMessages.forEach(m => msgCount[m.animal] = (msgCount[m.animal]||0)+1);
  const topMsg = Object.entries(msgCount).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('topAnimalMsg').textContent = topMsg ? `${topMsg[0]} (${topMsg[1]}건)` : '-';

  // 가장 많은 동물 (그림)
  const drawCount = {};
  allDrawings.forEach(d => drawCount[d.animal] = (drawCount[d.animal]||0)+1);
  const topDraw = Object.entries(drawCount).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('topAnimalDraw').textContent = topDraw ? `${topDraw[0]} (${topDraw[1]}건)` : '-';
}

function renderMessages() {
  document.getElementById('msgLoading').style.display = 'none';
  if (allMessages.length === 0) {
    document.getElementById('msgEmpty').style.display = 'block';
    return;
  }
  const tagClass = { turtle:'tag-turtle', bear:'tag-bear', whale:'tag-whale', manta:'tag-manta' };
  document.getElementById('msgTable').style.display = 'table';
  document.getElementById('msgBody').innerHTML = allMessages.map(m => `
    <tr>
      <td><span class="animal-tag ${tagClass[m.key]||''}">${m.animal}</span></td>
      <td>${m.text}</td>
      <td style="color:rgba(255,255,255,0.4);white-space:nowrap;">${m.time}</td>
    </tr>`).join('');
}

let currentFilter = 'all';
function renderGallery(filter) {
  currentFilter = filter;
  const data = filter === 'all' ? allDrawings : allDrawings.filter(d => d.animal === filter);
  const grid = document.getElementById('galleryGrid');
  document.getElementById('galleryLoading').style.display = 'none';

  if (data.length === 0) {
    grid.innerHTML = '';
    document.getElementById('galleryEmpty').style.display = 'block';
    return;
  }
  document.getElementById('galleryEmpty').style.display = 'none';
  grid.innerHTML = data.map((d,i) => `
    <div class="gallery-item" onclick="openLightbox('${d.src.replace(/'/g,"\\'")}','${d.animal} · ${d.time}')">
      <img src="${d.src}" alt="${d.animal}" loading="lazy">
      <div class="gallery-item-info">
        <span>${d.animal}</span><br>
        <span>${d.time.split(' ')[0]}</span>
      </div>
    </div>`).join('');
}

function filterGallery(filter, btn) {
  document.querySelectorAll('.gf-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderGallery(filter);
}

function switchTab(tab, btn) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('msgSection').style.display     = tab === 'msg'     ? 'block' : 'none';
  document.getElementById('gallerySection').style.display = tab === 'gallery' ? 'block' : 'none';
  if (tab === 'gallery') renderGallery(currentFilter);
}

function openLightbox(src, info) {
  document.getElementById('lbImg').src = src;
  document.getElementById('lbInfo').textContent = info;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}

// ── CSV 내보내기
const BOM = '\uFEFF';
// ── 바다 화면 리셋 (데이터는 유지, 표시만 초기화)
async function resetOcean() {
  if (!confirm('바다 화면을 리셋할까요?\n\n그림·메시지 데이터는 그대로 유지되고\n바다 화면에서만 모든 동물이 사라집니다.')) return;

  try {
    await db.collection('settings').doc('oceanReset').set({
      resetAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    alert('✅ 바다 화면이 리셋됐습니다!\n\n갤러리·메시지 데이터는 그대로입니다.');
  } catch(e) {
    console.error(e);
    alert('리셋 실패: ' + e.message);
  }
}

function downloadCsv(content, filename) {
  const blob = new Blob([content], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function exportMessages() {
  let csv = BOM + '동물,메시지,등록시간\n';
  allMessages.forEach(m => {
    csv += `"${m.animal}","${m.text.replace(/"/g,'""')}","${m.time}"\n`;
  });
  const date = new Date().toLocaleDateString('ko-KR').replace(/\. /g,'-').replace('.','');
  downloadCsv(csv, `응원메시지_${date}.csv`);
}

function exportDrawings() {
  let csv = BOM + '동물,등록시간\n';
  allDrawings.forEach(d => {
    csv += `"${d.animal}","${d.time}"\n`;
  });
  const date = new Date().toLocaleDateString('ko-KR').replace(/\. /g,'-').replace('.','');
  downloadCsv(csv, `그림업로드_${date}.csv`);
}

function exportSummary() {
  const animals = ['바다거북','북극곰','향유고래','대왕만타가오리'];
  let csv = BOM + '동물,응원메시지수,그림업로드수\n';
  animals.forEach(a => {
    const msgs  = allMessages.filter(m=>m.animal===a).length;
    const draws = allDrawings.filter(d=>d.animal===a).length;
    csv += `"${a}",${msgs},${draws}\n`;
  });
  csv += `"합계",${allMessages.length},${allDrawings.length}\n`;
  const date = new Date().toLocaleDateString('ko-KR').replace(/\. /g,'-').replace('.','');
  downloadCsv(csv, `요약통계_${date}.csv`);
}
</script>
</body>
</html>
